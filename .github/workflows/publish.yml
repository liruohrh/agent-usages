# Publishing is manual on purpose: the package name is not registered on npm
# yet, so a tag would only trigger a doomed `npm publish`. Tags are version
# markers; run this workflow from the Actions tab when the name exists.
name: publish

on:
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          registry-url: https://registry.npmjs.org
      # No `version:`: `packageManager` in package.json pins the exact pnpm, and the
      # action refuses to run when both are given.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # The published package carries `web/dist` (see `files` in package.json),
      # so the web UI needs no build on the user's machine — but the tarball must
      # not ship a stale bundle, hence the build here (`prepare` also runs it for
      # git installs). Both halves: the compiled CLI (`dist/`) and the dashboard.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter web typecheck
      - run: pnpm web:smoke
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
