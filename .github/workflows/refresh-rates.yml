# 刷新汇率表。
#
# 只做一件事：拉最新汇率、写回 `config/rates.json`、有变化就提交。
#
# 不在这里跑测试或 `check-config`：`update rates --write-config` 自己就会解析校验拉到的数据，
# 而它的产物只是一个数据文件——真正的把关在 `test.yml`（每次 push 都跑，包括这个 bot 的提交）。
# 一个每周跑的数据刷新任务不该顺带跑整套面板测试。
#
# 价格表是人工从厂商页面抄录的（HTML 无法可靠解析），改价格仍然走人工提交，价格表没有定时任务。
# 汇率每周一次（周一），与本地策略里的同一个数字一致：`CHECK_EVERY_DAYS.rates = 7`
# ——本地运行时"汇率每周检查一次"，这里就"每周刷新一次"，不是每天。
# 时间定在欧洲央行发布参考汇率（约 16:00 CET = 15:00 UTC）之后；也可以在 Actions 页面手动触发。
name: 刷新汇率表

on:
  schedule:
    - cron: '30 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-rates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 运行 CLI 需要那五个运行时依赖（commander、express…），所以这一步省不掉。
      - run: pnpm install --frozen-lockfile

      # 拉最新汇率并写回仓库里的配置文件：拉到的数据先解析校验，任一源都失败时命令返回非零。
      - name: 更新 config/rates.json
        run: node src/cli/index.ts update rates --force --write-config

      - name: 有变化才提交
        run: |
          if git diff --quiet -- config/rates.json; then
            echo "汇率没有变化，无需提交"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/rates.json
          git commit -m "chore: 刷新汇率表（$(date -u +%F)）"
          git push
