# Releasing: a tag produces the tarball users install.
#
# The point is that nobody builds the dashboard on their own machine. npm treats
# a tarball like a published package and runs **no build scripts** for it, so an
# install is seconds instead of the ~13 minutes a cold `github:` install costs
# (measured 2026-09-26) — provided the tarball carries `dist/` (the compiled CLI:
# Node refuses to strip types under `node_modules`) and `web/dist/`.
#
# The asset is the same `npm pack` output the npm registry path would publish, so
# when the package name finally exists, `publish.yml` ships the identical bytes.
name: release

on:
  push:
    tags: ['v*']
  # Re-uploading an asset (a deleted release, a failed upload) without inventing a
  # new version. The tag must already contain these helper scripts — true for any
  # tag cut after this workflow landed.
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag，例如 v0.0.1
        required: true

permissions:
  contents: write # create the release and upload the asset

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The tag's annotation becomes the release body, so the tag object has to
          # be in the clone.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      # The asset must be a commit that passed the suite: same gates as publish.yml.
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter web typecheck
      - run: pnpm web:smoke
      - run: pnpm release:pack
      # Installs the tarball the way a user does — under a dot-directory, on a port
      # nothing else occupies — and uses it: version, price table, config check, the
      # dashboard shell and a client-side route. Nothing is uploaded before this passes.
      - run: node scripts/verify-tarball.mjs release/agent-usages-*.tgz
      - name: 建 release 并上传 tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The release body is the tag's own annotation — the curated notes live with
          # the tag, and `gh release create` does not read it by itself. `--verify-tag`
          # refuses to invent a tag that was never pushed.
          notes=$(git tag -l --format='%(contents)' "$TAG")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes"
          elif [ -n "$notes" ]; then
            gh release create "$TAG" --title "$TAG" --verify-tag --notes "$notes"
          else
            gh release create "$TAG" --title "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" release/agent-usages-*.tgz --clobber
