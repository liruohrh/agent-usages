allowBuilds:
  esbuild: set this to true or false
# pnpm 10+ reads dependency-build approvals from here (not package.json "pnpm").
# vitest's bundler (esbuild) ships a native binary it installs via a build script,
# so the script must be allowed to run or `pnpm install` aborts.
onlyBuiltDependencies:
  - esbuild
